    <a href="../index.html" class="logo" aria-label="De Blå FC - Hjem">
      <img src="../assets/images/logo/Logo.jpg" alt="De Blå FC logo">

    <nav class="nav-right" role="navigation" aria-label="Primær navigation højre">
      <ul class="nav-links">
        <li class="dropdown">
          <button class="dropbtn" aria-haspopup="true" aria-expanded="false">Hvem er vi?</button>

            <li role="menuitem"><a href="information.html">Om os</a></li>

    <button class="burger" aria-label="Mobil menu" aria-expanded="false">☰</button>
  </div>
</header>

<main role="main">
  <div class="container">
    <article class="content">
      <h1>Kontakt os</h1>
      <p>Vi glæder os til at høre fra dig. Kontakt os gerne!</p>
      
      <div class="contact-info">
        <p><strong>Email:</strong> <a href="mailto:deblaafc@gmail.com">deblaafc@gmail.com</a></p>
      </div>
      
      <form class="contact-form" method="POST" action="#" aria-label="Kontaktformular">
        <div class="form-group">
          <label for="name">Navn:</label>
          <input type="text" id="name" name="name" required aria-required="true">
        </div>
        
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required aria-required="true">
        </div>
        
        <div class="form-group">
          <label for="message">Besked:</label>
          <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
        </div>
        
        <button type="submit" class="btn-submit">Send</button>
      </form>
    </article>
  </div>
</main>

<footer class="footer" role="contentinfo">
